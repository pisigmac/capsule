name: Capsule PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review-pr:
    name: 🛡️ Architectural & Knowledge Graph CI Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Capsule
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Schema Linter & Invariant Diff Check
        id: lint
        continue-on-error: true
        run: |
          caps ci check --base "origin/${{ github.base_ref }}" --output-md pr_lint_report.md

      - name: Run Code Drift & Boundary Verification
        id: drift
        continue-on-error: true
        run: |
          caps verify-drift --json > drift_report.json || true

      - name: Run Invariant Contradiction & Supersession Scan
        id: supersession
        continue-on-error: true
        run: |
          caps supersession scan --min-confidence 0.6 --json > supersession_report.json || true

      - name: Generate Unified PR Review Summary
        id: summary
        run: |
          python - << 'EOF'
          import json, os
          from pathlib import Path

          output_lines = [
              "## 🛡️ Capsule Knowledge & Architecture CI Review",
              "",
              "> Automated audit of atomic knowledge files, architectural boundaries, and invariant consistency for PR diff.",
              "",
          ]

          # 1. Lint Summary
          lint_md = Path("pr_lint_report.md")
          if lint_md.exists():
              output_lines.append("### 📋 Capsule Schema & Invariant Linter")
              output_lines.append(lint_md.read_text(encoding="utf-8"))
              output_lines.append("")

          # 2. Drift Summary
          drift_json = Path("drift_report.json")
          if drift_json.exists():
              try:
                  data = json.loads(drift_json.read_text(encoding="utf-8"))
                  output_lines.append("### 📐 Architectural Drift & Dead Code Analysis")
                  output_lines.append(f"- **Files Analyzed**: `{data.get('total_files_analyzed', 0)}`")
                  output_lines.append(f"- **Symbols Analyzed**: `{data.get('total_symbols_analyzed', 0)}`")
                  output_lines.append(f"- **Dead Code Warnings**: `{data.get('dead_code_count', 0)}`")
                  output_lines.append(f"- **Boundary Violations**: `{data.get('boundary_violations_count', 0)}`")
                  output_lines.append(f"- **Status**: {'✅ **PASSING**' if data.get('passing') else '❌ **VIOLATIONS DETECTED**'}")
                  output_lines.append("")
              except Exception:
                  pass

          # 3. Supersession Summary
          super_json = Path("supersession_report.json")
          if super_json.exists():
              try:
                  sdata = json.loads(super_json.read_text(encoding="utf-8"))
                  output_lines.append("### 🔄 Invariant Contradiction & Supersession Scan")
                  output_lines.append(f"- **Total Pairs Analyzed**: `{sdata.get('total_analyzed', 0)}`")
                  output_lines.append(f"- **Contradictions / Supersessions Detected**: `{sdata.get('contradictions_found', 0)}`")
                  if sdata.get('findings'):
                      output_lines.append("| Newer Capsule | Older Capsule | Type | Confidence | Reason |")
                      output_lines.append("|---|---|---|---|---|")
                      for f in sdata['findings'][:5]:
                          output_lines.append(f"| `{f['newer_topic']}` | `{f['older_topic']}` | `{f['contradiction_type']}` | `{int(f['confidence_score']*100)}%` | {f['reason']} |")
                  output_lines.append("")
              except Exception:
                  pass

          output_lines.append("---")
          output_lines.append("*Generated by Capsule CI Review Bot.*")

          final_md = "\n".join(output_lines)
          Path("combined_pr_review.md").write_text(final_md, encoding="utf-8")
          EOF

      - name: Comment PR with Review Report
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('combined_pr_review.md', 'utf8');
            const botHeader = '## 🛡️ Capsule Knowledge & Architecture CI Review';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes(botHeader));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
