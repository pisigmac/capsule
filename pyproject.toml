[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsule"
version = "0.5.0"
description = "Atomic, file-first long-term memory with bounded drift for autonomous AI agents (Capsule)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vikas Budde", email = "sigmapi1@outlook.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0.0",
    "psycopg[binary]>=3.1.0",
    "mcp>=1.8.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]
embed = [
    "sentence-transformers>=3.0.0",
]
eval = [
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "google-genai>=1.0.0",
]
langchain = [
    "langchain-core>=0.2.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
crewai = [
    "crewai>=0.28.0",
]

[project.scripts]
capsule = "capsule_cli.main:cli"
kapsule = "capsule_cli.main:cli"
caps = "capsule_cli.main:cli"
korn = "capsule_cli.main:cli"
pykorn = "capsule_cli.main:cli"

[project.urls]
Homepage = "https://github.com/pisigmac/capsule"
Repository = "https://github.com/pisigmac/capsule"
Documentation = "https://github.com/pisigmac/capsule/blob/main/docs/BENCHMARKS.md"
Changelog = "https://github.com/pisigmac/capsule/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "capsule_cli*", "evals*", "kapsule*"]

[tool.setuptools.package-data]
"evals.data" = ["*.json", "*.md"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
