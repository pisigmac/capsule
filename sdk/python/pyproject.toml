[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-ai"
version = "0.1.0"
description = "Thin Python client for the Capsule HTTP API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vikas Budde", email = "sigmapi1@outlook.com"}
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
]
keywords = ["kapsule", "capsule", "memory", "agents", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/pisigmac/capsule"
Repository = "https://github.com/pisigmac/capsule"
Issues = "https://github.com/pisigmac/capsule/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["capsule_ai*"]

[tool.setuptools.package-data]
capsule_ai = ["py.typed"]
