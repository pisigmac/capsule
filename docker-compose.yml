version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: capsule-postgres
    environment:
      POSTGRES_USER: capsule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capsule}
      POSTGRES_DB: capsule
    volumes:
      - capsule-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsule -d capsule"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capsule-api
    ports:
      - "9100:9000"
    environment:
      CAPSULE_DATABASE_URL: postgresql+psycopg://capsule:${POSTGRES_PASSWORD:-capsule}@postgres:5432/capsule
      CAPSULES_DIR: /data/capsules
      API_HOST: 0.0.0.0
      API_PORT: 9000
      CAPSULE_WATCH: "false"
      CAPSULE_RECONCILE: "true"
      CAPSULE_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: INFO
    volumes:
      - ./capsules:/data/capsules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capsule-sync
    environment:
      CAPSULE_DATABASE_URL: postgresql+psycopg://capsule:${POSTGRES_PASSWORD:-capsule}@postgres:5432/capsule
      CAPSULES_DIR: /data/capsules
      LOG_LEVEL: INFO
    volumes:
      - ./capsules:/data/capsules
    command: python -m services.sync
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capsule-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  capsule-pg:
